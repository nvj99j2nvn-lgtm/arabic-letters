name: Generate audio

on:
  workflow_dispatch:
    inputs:
      letters:
        description: "Letters: 0 (alif only), 0-3, 0,5,9 or all"
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install spekoai
      - name: Generate
        env:
          SPEKO_API_KEY: ${{ secrets.SPEKO_API_KEY }}
          LETTERS: ${{ inputs.letters }}
        run: python "generate audio.py"
      - name: Commit audio
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add audio
          git commit -m "Add generated audio" || echo "nothing to commit"
          git push
